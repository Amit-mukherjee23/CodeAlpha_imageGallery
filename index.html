<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Moogle Photos</h1>
      <p>Explore high-resolution photography across categories</p>
    </header>

    
    <div class="controls">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="architecture">Architecture</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
        <button class="filter-btn" data-filter="spiritual">spiritual</button>
        <button class="filter-btn" data-filter="Super Heroes">Super Heroes</button>
      </div>
      <input type="text" id="search" class="search-input" placeholder="Search gallery...">
    </div>

  
    <main class="gallery-grid" id="gallery"></main>
  </div>

 
  <div class="lightbox" id="lightbox">
    <button class="lightbox-btn close-btn" id="close-btn" aria-label="Close modal">&times;</button>
    <button class="lightbox-btn prev-btn" id="prev-btn" aria-label="Previous image">&#10094;</button>
    <button class="lightbox-btn next-btn" id="next-btn" aria-label="Next image">&#10095;</button>
    <div class="lightbox-content">
      <img src="" alt="" class="lightbox-img" id="lightbox-img">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>
 

 
  <script src="script.js"></script>
</body>
</html>
